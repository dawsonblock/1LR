[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lgae-v3"
version = "3.3.0"
description = "Laplacian Geometric Adaptive Evolution v3: multi-timescale geometric controller with fibers and curvature audits"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "LGAE-v3 project"}]
dependencies = [
  "torch>=2.6",
  "numpy>=2.0",
  "scipy>=1.12",
  "networkx>=3.2",
  "PyYAML>=6.0",
  "safetensors>=0.4",
]

[project.optional-dependencies]
ph = ["ripser>=0.6.12"]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
lgae-v3 = "lgae_v3.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "error",
  "ignore:.*Sparse invariant checks.*:UserWarning",
]
